<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#590907">
  <title>Stránka nenalezena | Tadeáš Ujváry</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #F5ECDC; color: #2A100E; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif }
    main { max-width: 34rem }
    h1 { margin: 0 0 16px; color: #590907; font: 400 clamp(2.6rem, 9vw, 4.5rem)/1.05 'Instrument Serif', 'Times New Roman', serif }
    p { margin: 0 0 28px; color: #6A4B45; font-size: 1.1rem; line-height: 1.6 }
    a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #590907; color: #F5ECDC; font-weight: 500; text-decoration: none }
    a:hover { background: #3A0605 }
  </style>
</head>
<body>
  <main>
    <h1>Tahle stránka tu není.</h1>
    <p>Odkaz je asi starý nebo v něm je překlep.</p>
    <a href="/">Zpět na úvod</a>
  </main>
</body>
</html>
