# Push do main nasadí web na Cloudflare. Potřebuje secret CLOUDFLARE_API_TOKEN; bez něj se krok přeskočí.
name: Nasazení

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nasazeni
  cancel-in-progress: false

jobs:
  nasazeni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bff24d8403d76050c61448401d0c3321
    steps:
      - name: Kontrola tokenu
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Chybí secret CLOUDFLARE_API_TOKEN, nenasazuji."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ok
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.token.outputs.ok
        with:
          node-version: 24
      - name: Nasadit
        if: steps.token.outputs.ok
        run: |
          npx --yes wrangler@4 deploy
